name: Gradle CI

# Validate code changes independently from the signed Release workflow.
# No third-party Actions are required; checkout and Android SDK setup use the runner tools.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Unit tests and Debug build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact triggering commit (without checkout actions)
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git clone --no-checkout --filter=blob:none "https://github.com/${REPOSITORY}.git" source
          git -C source fetch --depth=1 origin "${REF}"
          if ! git -C source cat-file -e "${SHA}^{commit}" 2>/dev/null; then
            git -C source fetch --depth=1 origin "${SHA}"
          fi
          git -C source checkout --detach "${SHA}"
          test "$(git -C source rev-parse HEAD)" = "${SHA}"

      - name: Configure Java and Android SDK
        id: android-sdk
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME_21_X64}" >> "$GITHUB_ENV"
          echo "${JAVA_HOME_21_X64}/bin" >> "$GITHUB_PATH"
          "${JAVA_HOME_21_X64}/bin/java" -version

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="${ANDROID_HOME}" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="${ANDROID_HOME}" --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358"
          test -f "${ANDROID_HOME}/platforms/android-37.0/android.jar"
          test -d "${ANDROID_HOME}/ndk/28.2.13676358"

      - name: Run unit tests
        id: unit-tests
        if: ${{ !cancelled() && steps.android-sdk.outcome == 'success' }}
        working-directory: source
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace test

      - name: Compile Debug APK
        if: ${{ !cancelled() && steps.android-sdk.outcome == 'success' }}
        working-directory: source
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Summarize unit-test reports
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.unit-tests.outcome }}
        run: |
          {
            echo "## Gradle CI"
            echo "- Unit tests: ${TEST_OUTCOME:-not run}"
            if [ -d source ]; then
              python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          files = glob.glob("source/**/build/test-results/test/*.xml", recursive=True)
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for filename in files:
              try:
                  root = ET.parse(filename).getroot()
              except (ET.ParseError, OSError):
                  continue
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          if files:
              print("- XML test reports: " + str(len(files)))
              print("- Tests: {tests}, failures: {failures}, errors: {errors}, skipped: {skipped}".format(**totals))
          else:
              print("- XML test reports: none generated")
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"
