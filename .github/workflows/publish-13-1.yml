name: Publish Look4Sat v4.4.8-ba7opf.13.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - gradle/libs.versions.toml

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact release commit
        run: |
          git clone --depth 1 --branch main --single-branch https://github.com/atsunatsu/Look4Sat.git source
          test "$(git -C source rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Validate requested version
        working-directory: source
        run: |
          grep -Fx 'appVersionName = "4.4.8-ba7opf.13.1"' gradle/libs.versions.toml
          grep -Fx 'appVersionCode = "604"' gradle/libs.versions.toml

      - name: Configure Java and Android SDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;37.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"

      - name: Build signed release APK with repository signing key
        working-directory: source
        env:
          KEY_STORE_B64: ${{ secrets.KEY_STORE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEY_STORE_B64" "$RELEASE_STORE_PASSWORD" "$RELEASE_KEY_ALIAS" "$RELEASE_KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              echo "::error::Repository release signing secrets are missing; cannot publish a compatible release."
              exit 1
            fi
          done
          printf '%s' "$KEY_STORE_B64" | base64 -d > "$HOME/my-release-key.jks"
          chmod 600 "$HOME/my-release-key.jks"
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release.apk
          rm -f "$HOME/my-release-key.jks"

      - name: Verify APK signature matches existing v13 release
        working-directory: source
        run: |
          set -euo pipefail
          SIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          APK="app/build/outputs/apk/release/app-release.apk"
          test -x "$SIGNER"
          "$SIGNER" verify --verbose "$APK"
          OLD_APK="/tmp/previous-look4sat-v13.apk"
          curl -fL --retry 3 --retry-delay 2 "https://github.com/atsunatsu/Look4Sat/releases/download/v4.4.8-ba7opf.13/Look4Sat-4.4.8-ba7opf.13.apk" -o "$OLD_APK"
          # build-tools 37 renamed the printed label ("Signer #1 certificate …" -> "V2 Signer:
          # certificate …"), which silently emptied the old extraction below and failed this step
          # with a bare exit 1. Match the stable tail of the line instead, and log both digests.
          apk_cert() {
            "$SIGNER" verify --print-certs "$1" \
              | grep -i 'certificate SHA-256 digest:' | head -n 1 \
              | sed -E 's/^.*certificate SHA-256 digest: *//' | tr -d '\r' || true
          }
          NEW_CERT="$(apk_cert "$APK")"
          OLD_CERT="$(apk_cert "$OLD_APK")"
          echo "new cert: $NEW_CERT"
          echo "old cert: $OLD_CERT"
          if [ -z "$NEW_CERT" ] || [ -z "$OLD_CERT" ]; then
            echo "::error::Could not read a signing certificate digest - apksigner output changed again?"
            exit 1
          fi
          if [ "$NEW_CERT" != "$OLD_CERT" ]; then
            echo "::error::Release signing certificate differs from v13. Aborting to protect upgrades."
            exit 1
          fi
          echo "Signed APK and existing v13 use the same signing certificate."

      - name: Publish v4.4.8-ba7opf.13.1 GitHub Release
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v4.4.8-ba7opf.13.1"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to replace an existing published APK."
            exit 1
          fi
          gh release create "$TAG" "app/build/outputs/apk/release/app-release.apk#Look4Sat-4.4.8-ba7opf.13.1.apk" \
            --target "$GITHUB_SHA" \
            --title "Look4Sat v4.4.8-ba7opf.13.1" \
            --latest \
            --notes "VUCC 网格地图更新：支持多台址勾选、台址选择记忆、跨台址网格合并统计、过滤后的 QSO 明细与首通呼号显示。包含 PR #10 与 PR #12 的修复。采用与 v4.4.8-ba7opf.13 相同的发布签名，可覆盖安装。"
          echo "Published release $TAG"
